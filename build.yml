name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p app/src/main/java/com/pistoleros/game app/src/main/assets
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/com/pistoleros/game/
          cp index.html app/src/main/assets/
          cp app.gradle app/build.gradle
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Pistoleros-APK, path: app/build/outputs/apk/debug/app-debug.apk }
