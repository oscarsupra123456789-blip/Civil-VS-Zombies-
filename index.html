 else if(a==='heal'&&G.money>=30&&P.hp<100){G.money-=30;P.hp=Math.min(100,P.hp+50);snd('coin')}
 shopUI()});
function openShop(v){if(over||!started)return;paused=v;$('shop').style.display=v?'flex':'none';if(v)shopUI()}
$('sb').onpointerdown=()=>openShop(true);$('sx').onclick=()=>openShop(false);
function swap(){const ks=Object.keys(G.w),i=ks.indexOf(G.cur);G.cur=ks[(i+1)%ks.length];P.rl=0;snd('click')}

function reload(){const w=WD[G.cur],o=G.w[G.cur];if(!over&&P.rl<=0&&o.ammo<w.mag){P.rl=1.2;snd('rl')}}

 try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}

// controles
const S={l:{id:null,x:0,y:0,dx:0,dy:0},r:{id:null,x:0,y:0,dx:0,dy:0}},M={x:0,y:0,d:false,on:false},K={};
const cap=(s,e)=>{let a=(e.clientX-s.x)/55,b=(e.clientY-s.y)/55;const l=Math.hypot(a,b);if(l>1){a/=l;b/=l}s.dx=a;s.dy=b};
cv.addEventListener('pointerdown',e=>{if(over||paused)return;cv.setPointerCapture(e.pointerId);

 const s=e.clientX<W/2?S.l:S.r;if(s.id!==null)return;s.id=e.pointerId;s.x=e.clientX;s.y=e.clientY;s.dx=s.dy=0});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){M.x=e.clientX;M.y=e.clientY;M.on=true;return}for(const s of[S.l,S.r])if(s.id===e.pointerId)cap(s,e)});
const up=e=>{if(e.pointerType==='mouse')M.d=false;for(const s of[S.l,S.r])if(s.id===e.pointerId){s.id=null;s.dx=s.dy=0}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(k==='r')reload();if(k==='q')swap();if(k==='b')openShop(!paused)});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
// juego
function boom(px,py,c,n){for(let i=0;i<n;i++){const a=R()*6.3,v=60+R()*200;F.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.4+R()*.4,c})}}
function edge(){const s=Math.floor(R()*4);return s<2?[R()*W,s?H+30:-30]:[s===2?-30:W+30,R()*H]}
function spawn(){const[px,py]=edge(),q=R(),sp=50+ms*5;
 let e={x:px,y:py,r:15,hp:2,sp,c:'#6fbf4a',v:0,$:5};
 if(ms>=2&&q<.25)e={x:px,y:py,r:11,hp:1.5,sp:sp*1.9,c:'#d9d93a',v:1,$:8};
 else if(ms>=2&&q>.85)e={x:px,y:py,r:24,hp:10,sp:sp*.7,c:'#9b3fb5',v:2,m:10,$:25};
 E.push(e);if(R()<.3)snd('groan')}
function startBoss(){ph='boss';E=[];B=[];bossT=3;const h=50+ms*25;E.push({x:W/2,y:-60,r:42,hp:h,m:h,sp:45,c:'#b71c1c',v:3,boss:1,$:200*ms,t:0});snd('roar');shake=10}
function upd(dt){time+=dt;gt-=dt;
 let mx=S.l.dx+((K.d||K.arrowright)?1:0)-((K.a||K.arrowleft)?1:0),my=S.l.dy+((K.s||K.arrowdown)?1:0)-((K.w||K.arrowup)?1:0);
 const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 P.x=Math.max(20,Math.min(W-20,P.x+mx*210*dt));P.y=Math.max(20,Math.min(H-20,P.y+my*210*dt));
 const w=WD[G.cur],o=G.w[G.cur],dmg=w.dmg*(1+.25*o.lv),rt=w.rate*(1-.07*o.lv);let fire=false;const r=S.r;
 if(r.id!==null&&Math.hypot(r.dx,r.dy)>.25){P.ang=Math.atan2(r.dy,r.dx);fire=true}else if(M.on){P.ang=Math.atan2(M.y-P.y,M.x-P.x);fire=M.d}
 P.cd-=dt;if(P.rl>0){P.rl-=dt;if(P.rl<=0)o.ammo=w.mag}
 if(fire&&P.cd<=0&&P.rl<=0){if(o.ammo>0){o.ammo--;P.cd=rt;shake=w.p>1?6:3;snd(G.cur);
   for(let i=0;i<w.p;i++){const a=P.ang+(R()-.5)*w.sp*2;B.push({x:P.x+Math.cos(a)*28,y:P.y+Math.sin(a)*28,vx:Math.cos(a)*800,vy:Math.sin(a)*800,l:.7,d:dmg,pr:w.pr})}}else reload()}
 if(o.ammo===0&&P.rl<=0)reload();
 if(ph==='kill'){spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.3,1.3-ms*.1)}}
 if(ph==='boss'){bossT-=dt;if(bossT<=0){const[px,py]=edge();E.push({x:px,y:py,r:15,hp:2,sp:70,c:'#6fbf4a',v:0,$:5});bossT=4}}
 if(ph==='portal'&&Math.hypot(P.x-W+80,P.y-H/2)<42)startBoss();
 for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt}
 for(const e of E){const a=Math.atan2(P.y-e.y,P.x-e.x);let s=e.sp;if(e.boss){e.t+=dt;if(e.t%5>4.2)s*=4.5}
  e.x+=Math.cos(a)*s*dt;e.y+=Math.sin(a)*s*dt;e.a=a;
  if(Math.hypot(P.x-e.x,P.y-e.y)<e.r+14){P.hp-=(e.boss?45:28)*dt;shake=Math.max(shake,2)}
  for(const b of B)if(b.l>0&&!(b.h&&b.h.has(e))&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){if(b.pr)(b.h=b.h||new Set()).add(e);else b.l=0;e.hp-=b.d;boom(b.x,b.y,'#b71c1c',5);snd('hit');if(R()<.15)snd('groan')}
  if(e.hp<=0&&!e.dead){e.dead=1;G.money+=e.$;G.sc+=e.$*2;boom(e.x,e.y,e.c,e.boss?50:14);snd('die');snd('coin');if(R()<.1)I.push({x:e.x,y:e.y});
   if(e.boss){ph='won';bossT=3;toast('🏆 ¡Zombie Líder derrotado! +$'+200*ms)}else if(ph==='kill'){kills++;if(kills>=goal){ph='portal';E=[];toast('🌀 ¡Se abrió un portal! Entra para enfrentar al líder')}}}}
 E=E.filter(e=>!e.dead);B=B.filter(b=>b.l>0);
 if(ph==='won'){bossT-=dt;if(bossT<=0){ms++;newMs();toast('Misión '+ms+': mata '+goal+' zombies')}}
 I=I.filter(i=>{if(Math.hypot(P.x-i.x,P.y-i.y)<26){P.hp=Math.min(100,P.hp+25);return false}return true});
 for(const f of F){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}F=F.filter(f=>f.l>0);
 if(P.hp<=0){over=true;S.l.id=S.r.id=null;S.l.dx=S.l.dy=S.r.dx=S.r.dy=0;if(G.sc>best){best=G.sc;try{localStorage.setItem('pbest',best)}catch(e){}}
  $('fin').textContent='Misión '+ms+' · Puntaje: '+G.sc+' · Mejor: '+best;$('over').style.display='flex'}}
let tmsg='',tt=0;function toast(s){tmsg=s;tt=3.5}
function stick(s,hx,hy,c){const act=s.id!==null,bx=act?s.x:hx,by=act?s.y:hy;x.globalAlpha=act?.9:.5;
 let g=x.createRadialGradient(bx,by,15,bx,by,58);g.addColorStop(0,`rgba(${c},.08)`);g.addColorStop(1,`rgba(${c},.45)`);x.fillStyle=g;x.beginPath();x.arc(bx,by,58,0,6.3);x.fill();
 x.strokeStyle=`rgba(${c},.9)`;x.lineWidth=3;x.stroke();x.lineWidth=2;x.setLineDash([3,7]);x.beginPath();x.arc(bx,by,42,0,6.3);x.stroke();x.setLineDash([]);
 const kx=bx+s.dx*55,ky=by+s.dy*55;g=x.createRadialGradient(kx-6,ky-6,2,kx,ky,26);g.addColorStop(0,'#fff');g.addColorStop(1,`rgb(${c})`);x.fillStyle=g;x.beginPath();x.arc(kx,ky,24,0,6.3);x.fill();x.globalAlpha=1}
function draw(){x.save();x.fillStyle=ph==='boss'?'#2a1417':'#1d2229';x.fillRect(0,0,W,H);
 if(shake>.2){x.translate((R()-.5)*shake,(R()-.5)*shake);shake*=.85}
 x.strokeStyle='#ffffff0d';x.lineWidth=1;x.beginPath();for(let i=0;i<W;i+=40){x.moveTo(i,0);x.lineTo(i,H)}for(let j=0;j<H;j+=40){x.moveTo(0,j);x.lineTo(W,j)}x.stroke();
 if(ph==='portal'){const px=W-80,py=H/2;for(let i=0;i<4;i++){x.strokeStyle=`rgba(${120+i*30},80,255,${.9-i*.2})`;x.lineWidth=5;x.beginPath();x.ellipse(px,py,16+i*9+Math.sin(time*4+i)*3,34+i*10,time*2+i,0,6.3);x.stroke()}}
 for(const i of I){x.fillStyle='#fff';x.fillRect(i.x-9,i.y-9,18,18);x.fillStyle='#e53935';x.fillRect(i.x-2,i.y-7,4,14);x.fillRect(i.x-7,i.y-2,14,4)}
 for(const f of F){x.globalAlpha=Math.max(0,f.l*2);x.fillStyle=f.c;x.fillRect(f.x,f.y,4,4)}x.globalAlpha=1;
 for(const e of E){zomb(e);const a=e.a||0;x.fillStyle=e.c;x.globalAlpha=0;
  for(const s of[-1,1]){x.beginPath();x.arc(e.x+Math.cos(a)*e.r*1.05-Math.sin(a)*s*e.r*.7,e.y+Math.sin(a)*e.r*1.05+Math.cos(a)*s*e.r*.7,e.r*.3,0,6.3);x.fill()}
  x.beginPath();x.arc(e.x,e.y,e.r,0,6.3);x.fill();
  x.fillStyle='#c00';for(const s of[-1,1]){x.beginPath();x.arc(e.x+Math.cos(a)*e.r*.5-Math.sin(a)*s*e.r*.4,e.y+Math.sin(a)*e.r*.5+Math.cos(a)*s*e.r*.4,e.r*.18,0,6.3);x.fill()}
  x.globalAlpha=1;if(e.m&&!e.boss){x.fillStyle='#0008';x.fillRect(e.x-18,e.y-e.r-9,36,5);x.fillStyle='#e53935';x.fillRect(e.x-18,e.y-e.r-9,36*e.hp/e.m,5)}}
 x.fillStyle='#ffe066';for(const b of B){x.beginPath();x.arc(b.x,b.y,3.5,0,6.3);x.fill()}
 const w=WD[G.cur];x.save();x.translate(P.x,P.y);x.rotate(P.ang);playerDraw(w);x.globalAlpha=0;
 if(P.cd>w.rate*.7){x.fillStyle='#ffd54f';x.beginPath();x.arc(w.l+6,0,8,0,6.3);x.fill()}x.restore();
 
 const boss=E.find(e=>e.boss);if(boss){x.fillStyle='#0009';x.fillRect(W/2-120,H-30,240,12);x.fillStyle='#e53935';x.fillRect(W/2-120,H-30,240*Math.max(0,boss.hp)/boss.m,12);x.fillStyle='#fff';x.font='bold 11px system-ui';x.textAlign='center';x.fillText('ZOMBIE LÍDER',W/2,H-34)}
 x.restore();stick(S.l,110,H-100,'255,255,255');stick(S.r,W-110,H-100,'255,82,82');
 if(tt>0){x.globalAlpha=Math.min(1,tt);x.fillStyle='#fff';x.font='bold 20px system-ui';x.textAlign='center';x.fillText(tmsg,W/2,H*.3);x.globalAlpha=1}
 $('hpf').style.width=Math.max(0,P.hp)+'%';$('hpt').textContent=Math.ceil(Math.max(0,P.hp));$('mon').textContent='💰 $'+Math.floor(G.money);
 $('mid').textContent=ph==='kill'?`Misión ${ms}: mata ${goal} zombies (${kills}/${goal})`:ph==='portal'?'🌀 Entra al portal':ph==='boss'?'👹 Derrota al Zombie Líder':'🏆 Misión cumplida';
 $('rt').innerHTML=w.n+' Nv'+G.w[G.cur].lv+'<br>'+(P.rl>0?'Recargando…':'🔫 '+G.w[G.cur].ammo+'/'+w.mag)}
let last=performance.now();reset();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;tt-=dt;if(started&&!over&&!paused&&H<=W)upd(dt);draw()})(last);
